<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PushOps · Spike de cámara</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/views.css">
</head>
<body>
<div class="spike">
  <div class="flex-between">
    <h1 style="font-size:18px;font-weight:800">Spike de cámara</h1>
    <span class="badge" id="env">…</span>
  </div>

  <p class="small muted" style="margin:0">
    Diagnóstico de la cámara dentro de Telegram. Necesita HTTPS. Abre esta página
    desde el bot para probar el WebView real.
  </p>

  <div class="spike__stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="canvas"></canvas>
  </div>

  <button class="btn btn--block" id="start">Activar la cámara y el modelo</button>

  <div class="spike__grid">
    <div class="spike__cell"><div class="spike__k">Píxeles</div><div class="spike__v" id="pixels">—</div></div>
    <div class="spike__cell"><div class="spike__k">Landmarks</div><div class="spike__v" id="landmarks">—</div></div>
    <div class="spike__cell"><div class="spike__k">FPS</div><div class="spike__v" id="fps">—</div></div>
    <div class="spike__cell"><div class="spike__k">Cobertura</div><div class="spike__v" id="coverage">—</div></div>
    <div class="spike__cell"><div class="spike__k">Ángulo codo</div><div class="spike__v" id="elbow">—</div></div>
    <div class="spike__cell"><div class="spike__k">Delegate</div><div class="spike__v" id="delegate">—</div></div>
  </div>

  <div class="spike__log" id="log">Iniciando…</div>

  <button class="btn btn--ghost btn--block" id="toggle-masks">Alternar máscaras</button>
</div>

<script type="module" src="/js/spike.js"></script>
</body>
</html>
