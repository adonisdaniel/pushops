<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1116">
<meta name="description" content="PushOps — cuenta tus flexiones con la cámara y compite con tus amigos.">
<title>PushOps</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/views.css">
</head>
<body>

<div id="app" class="app">
  <header id="topbar" class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5v11"/><path d="M17.5 6.5v11"/><path d="M3 9v6"/><path d="M21 9v6"/><path d="M6.5 12h11"/>
        </svg>
      </span>
      <span class="topbar__title">PushOps</span>
    </div>
    <div class="topbar__nick" id="topbar-nick" hidden></div>
  </header>

  <main id="view" class="view" role="main"></main>

  <nav id="tabbar" class="tabbar" aria-label="Navegación principal">
    <a class="tabbar__item" href="#/counter" data-tab="counter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20v-6M10 20V9M16 20v-9M22 20V5"/></svg>
      <span>Contador</span>
    </a>
    <a class="tabbar__item" href="#/stats" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><rect x="5" y="11" width="3.5" height="6" rx="1"/><rect x="10.2" y="7" width="3.5" height="10" rx="1"/><rect x="15.5" y="13" width="3.5" height="4" rx="1"/></svg>
      <span>Stats</span>
    </a>
    <a class="tabbar__item" href="#/friends" data-tab="friends">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.1 2.7-5 6-5s6 1.9 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.6"/><path d="M17.5 14.4c2.1.6 3.5 2.2 3.5 4.6"/></svg>
      <span>Amigos</span>
    </a>
    <a class="tabbar__item" href="#/groups" data-tab="groups">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="2.6"/><circle cx="5.5" cy="17" r="2.6"/><circle cx="18.5" cy="17" r="2.6"/><path d="M10.3 8 6.9 14.6M13.7 8l3.4 6.6M8.1 17h7.8"/></svg>
      <span>Grupos</span>
    </a>
    <a class="tabbar__item" href="#/profile" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-3.9 3.4-6.2 7.5-6.2s7.5 2.3 7.5 6.2"/></svg>
      <span>Perfil</span>
    </a>
  </nav>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
